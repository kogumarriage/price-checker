<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>単価比較アプリ</title>

<!-- アイコン -->
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<!-- テーマカラー -->
<meta name="theme-color" content="#ff7f50">

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: linear-gradient(135deg, #eef2f7, #dfe9f3);
  margin: 0;
}

.container {
  max-width: 420px;
  margin: auto;
  padding: 20px;
}

h1 {
  text-align: center;
  margin-bottom: 20px;
}

.card {
  background: white;
  padding: 16px;
  margin-bottom: 15px;
  border-radius: 16px;
  box-shadow: 0 6px 15px rgba(0,0,0,0.08);
}

h3 {
  margin-bottom: 10px;
}

input, select {
  width: 100%;
  padding: 14px;
  margin-bottom: 10px;
  border-radius: 10px;
  border: 1px solid #ddd;
  font-size: 16px;
  box-sizing: border-box;
}

button {
  width: 100%;
  padding: 16px;
  background: linear-gradient(135deg, #ff7f50, #ff9966);
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 18px;
  font-weight: bold;
  box-shadow: 0 4px 10px rgba(255,127,80,0.4);
  transition: 0.2s;
}

button:active {
  transform: scale(0.97);
}

.result {
  display: none; /* ← 白枠対策 */
  margin-top: 20px;
  background: white;
  padding: 18px;
  border-radius: 16px;
  text-align: center;
  box-shadow: 0 6px 15px rgba(0,0,0,0.08);
}

.highlight {
  font-size: 20px;
  font-weight: bold;
  color: #ff7f50;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="container">

<h1>🛒 単価比較</h1>

<div class="card">
<h3>商品A</h3>
<input type="number" id="aQty" placeholder="数量">
<select id="aUnit">
<option value="1">個</option>
<option value="1">g</option>
<option value="1000">kg</option>
<option value="1">ml</option>
<option value="1000">L</option>
</select>
<input type="number" id="aPrice" placeholder="価格（円）">
</div>

<div class="card">
<h3>商品B</h3>
<input type="number" id="bQty" placeholder="数量">
<select id="bUnit">
<option value="1">個</option>
<option value="1">g</option>
<option value="1000">kg</option>
<option value="1">ml</option>
<option value="1000">L</option>
</select>
<input type="number" id="bPrice" placeholder="価格（円）">
</div>

<button onclick="compare()">比較する</button>

<div class="result" id="result"></div>

</div>

<script>
function calc(price, qty, unit) {
  return price / (qty * unit);
}

function per100g(price, qty, unit) {
  return (price / (qty * unit)) * 100;
}

function compare() {
  const aQty = document.getElementById("aQty").value;
  const aUnit = document.getElementById("aUnit").value;
  const aPrice = document.getElementById("aPrice").value;

  const bQty = document.getElementById("bQty").value;
  const bUnit = document.getElementById("bUnit").value;
  const bPrice = document.getElementById("bPrice").value;

  if (!aQty || !aPrice || !bQty || !bPrice) {
    document.getElementById("result").style.display = "block";
    document.getElementById("result").innerHTML = "⚠️ 入力してください";
    return;
  }

  const a = calc(aPrice, aQty, aUnit);
  const b = calc(bPrice, bQty, bUnit);

  const a100 = per100g(aPrice, aQty, aUnit);
  const b100 = per100g(bPrice, bQty, bUnit);

  let winner = "";
  if (a < b) {
    winner = "商品Aの方がお得";
  } else if (b < a) {
    winner = "商品Bの方がお得";
  } else {
    winner = "同じ価格";
  }

  document.getElementById("result").style.display = "block";

  document.getElementById("result").innerHTML =
    `
    A：${a.toFixed(2)} 円<br>
    B：${b.toFixed(2)} 円<br><br>

    A（100g）：${a100.toFixed(1)} 円<br>
    B（100g）：${b100.toFixed(1)} 円<br><br>

    <div class="highlight">${winner}</div>
    `;
}
</script>

</body>
</html>
