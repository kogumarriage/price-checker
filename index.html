<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ff7f9f">

<title>こぐまりっじ比較</title>

<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@2"></script>

<style>
body {
  font-family: -apple-system;
  background: linear-gradient(135deg, #ffe4ec, #fff6f9);
  margin: 0;
}

.container {
  max-width: 420px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 16px;
  box-shadow: 0 5px 12px rgba(0,0,0,0.1);
}

input, select {
  width: 100%;
  padding: 14px;
  margin-bottom: 10px;
  border-radius: 10px;
  border: 1px solid #ddd;
  font-size: 16px;
  box-sizing: border-box;
}

button {
  width: 100%;
  padding: 15px;
  background: linear-gradient(135deg, #ff7f9f, #ffb6c1);
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 18px;
  font-weight: bold;
}

.result {
  display: none;
  background: white;
  padding: 20px;
  border-radius: 16px;
  text-align: center;
}

.big-result {
  font-size: 30px;
  font-weight: bold;
  margin: 10px 0;
}

.price-diff {
  font-size: 22px;
  font-weight: bold;
  margin: 10px 0;
}

.percent {
  font-size: 18px;
}

.winA { color: #ff2d55; }
.winB { color: #2d6cff; }

.kuma {
  font-size: 42px;
}

video {
  width: 100%;
  border-radius: 10px;
  display: none;
}
</style>
</head>

<body>

<div class="container">

<h2>🧸 こぐまりっじ比較</h2>

<div class="card">
<h3>商品A</h3>
<input id="aQty" placeholder="数量">
<select id="aUnit">
<option value="1">個</option>
<option value="1">g</option>
<option value="1000">kg</option>
<option value="1">ml</option>
<option value="1000">L</option>
</select>
<input id="aPrice" placeholder="価格（円）">
<button onclick="startCamera('a')">📷 値札を撮影</button>
</div>

<div class="card">
<h3>商品B</h3>
<input id="bQty" placeholder="数量">
<select id="bUnit">
<option value="1">個</option>
<option value="1">g</option>
<option value="1000">kg</option>
<option value="1">ml</option>
<option value="1000">L</option>
</select>
<input id="bPrice" placeholder="価格（円）">
<button onclick="startCamera('b')">📷 値札を撮影</button>
</div>

<video id="camera" autoplay></video>
<button id="captureBtn" onclick="capture()" style="display:none;">📸 撮影</button>

<button onclick="compare()">比較する</button>

<div id="result" class="result"></div>

</div>

<script>
let currentTarget = "";
let stream;

function startCamera(target) {
  currentTarget = target;
  navigator.mediaDevices.getUserMedia({
    video: { facingMode: "environment" }
  }).then(s => {
    stream = s;
    camera.style.display = "block";
    camera.srcObject = s;
    captureBtn.style.display = "block";
  });
}

function capture() {
  const canvas = document.createElement("canvas");
  canvas.width = camera.videoWidth;
  canvas.height = camera.videoHeight;
  canvas.getContext("2d").drawImage(camera, 0, 0);

  Tesseract.recognize(canvas, 'eng').then(({ data: { text } }) => {
    const nums = text.match(/\d+/g);
    if (nums) {
      document.getElementById(currentTarget + "Price").value = nums[0];
    }
  });

  stream.getTracks().forEach(track => track.stop());
  camera.style.display = "none";
  captureBtn.style.display = "none";
}

function calc(price, qty, unit) {
  return price / (qty * unit);
}

function compare() {
  const aPriceVal = Number(aPrice.value);
  const aQtyVal = Number(aQty.value);
  const aUnitVal = Number(aUnit.value);

  const bPriceVal = Number(bPrice.value);
  const bQtyVal = Number(bQty.value);
  const bUnitVal = Number(bUnit.value);

  if (!aPriceVal || !aQtyVal || !bPriceVal || !bQtyVal) {
    result.style.display = "block";
    result.innerHTML = "⚠️ 数値を入力してください";
    return;
  }

  const a = calc(aPriceVal, aQtyVal, aUnitVal);
  const b = calc(bPriceVal, bQtyVal, bUnitVal);

  const rawDiff = Math.abs(a - b);
  const percent = (rawDiff / Math.max(a, b)) * 100;

  // ★ 完全一致判定（誤差対応）
  if (rawDiff < 0.0001) {
    result.style.display = "block";
    result.innerHTML = `
      <div class="kuma">🧸🎩</div>
      <div class="big-result">🤝 ほぼ同じ価格です</div>
    `;
    return;
  }

  // ★ 表示用差額（最低0.01円）
  let displayDiff = rawDiff < 0.01 ? 0.01 : rawDiff;

  let message = "";
  let priceDiffText = "";
  let winClass = "";

  if (a < b) {
    message = "🔥 商品Aが圧倒的にお得！";
    priceDiffText = `👉 Bより ${displayDiff.toFixed(2)}円/単位 安い`;
    winClass = "winA";
  } else {
    message = "🔥 商品Bが圧倒的にお得！";
    priceDiffText = `👉 Aより ${displayDiff.toFixed(2)}円/単位 安い`;
    winClass = "winB";
  }

  result.style.display = "block";

  result.innerHTML = `
    <div class="kuma">🧸🎩</div>

    <div class="big-result ${winClass}">
      ${message}
    </div>

    <div class="price-diff ${winClass}">
      ${priceDiffText}
    </div>

    <div class="percent ${winClass}">
      👉 約 ${percent.toFixed(1)}% お得
    </div>
  `;
}
</script>

</body>
</html>
