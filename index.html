<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>単価比較アプリ</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont;
  background: #f5f6fa;
  margin: 0;
}

.container {
  max-width: 400px;
  margin: auto;
  padding: 20px;
}

h1 {
  text-align: center;
}

.card {
  background: white;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 12px;
}

input, select {
  width: 100%;
  padding: 12px;
  margin-top: 8px;
  margin-bottom: 10px;
  border-radius: 8px;
  border: 1px solid #ddd;
  font-size: 16px;
  box-sizing: border-box; /* ←これが修正ポイント */
}

button {
  width: 100%;
  padding: 15px;
  background: #ff7f50;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 18px;
}

.result {
  margin-top: 20px;
  background: #fff;
  padding: 15px;
  border-radius: 12px;
  text-align: center;
}
</style>

</head>
<body>

<div class="container">

<h1>単価比較</h1>

<div class="card">
<h3>商品A</h3>
<input type="number" id="aQty" placeholder="数量">
<select id="aUnit">
<option value="1">個</option>
<option value="1">g</option>
<option value="1000">kg</option>
<option value="1">ml</option>
<option value="1000">L</option>
</select>
<input type="number" id="aPrice" placeholder="価格">
</div>

<div class="card">
<h3>商品B</h3>
<input type="number" id="bQty" placeholder="数量">
<select id="bUnit">
<option value="1">個</option>
<option value="1">g</option>
<option value="1000">kg</option>
<option value="1">ml</option>
<option value="1000">L</option>
</select>
<input type="number" id="bPrice" placeholder="価格">
</div>

<button onclick="compare()">比較する</button>

<div class="result" id="result"></div>

</div>

<script>
function calc(price, qty, unit) {
  return price / (qty * unit);
}

function per100g(price, qty, unit) {
  const gram = qty * unit;
  if (gram === 0) return 0;
  return (price / gram) * 100;
}

function compare() {
  const aQty = document.getElementById("aQty").value;
  const aUnit = document.getElementById("aUnit").value;
  const aPrice = document.getElementById("aPrice").value;

  const bQty = document.getElementById("bQty").value;
  const bUnit = document.getElementById("bUnit").value;
  const bPrice = document.getElementById("bPrice").value;

  // 入力チェック
  if (!aQty || !aPrice || !bQty || !bPrice) {
    document.getElementById("result").innerHTML = "⚠️ すべて入力してください";
    return;
  }

  const a = calc(aPrice, aQty, aUnit);
  const b = calc(bPrice, bQty, bUnit);

  const a100 = per100g(aPrice, aQty, aUnit);
  const b100 = per100g(bPrice, bQty, bUnit);

  let result = "";

  if (a < b) {
    result = "👉 商品Aの方が安い";
  } else if (b < a) {
    result = "👉 商品Bの方が安い";
  } else {
    result = "👉 同じ価格";
  }

  const diff = Math.abs(a - b);
  const percent = (diff / Math.max(a, b)) * 100;

  document.getElementById("result").innerHTML =
    `
    A単価：${a.toFixed(2)} 円<br>
    B単価：${b.toFixed(2)} 円<br><br>

    A（100gあたり）：${a100.toFixed(1)} 円<br>
    B（100gあたり）：${b100.toFixed(1)} 円<br><br>

    差額：${diff.toFixed(2)} 円<br>
    お得率：約 ${percent.toFixed(1)} %<br><br>

    <b>${result}</b>
    `;
}
</script>

</body>
</html>
