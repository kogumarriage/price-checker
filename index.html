<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>こぐまりっじ比較</title>

<style>
body {
  font-family: -apple-system;
  background: linear-gradient(135deg, #ffe4ec, #fff6f9);
  margin: 0;
}

.container {
  max-width: 420px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 15px;
  margin-bottom: 10px;
  border-radius: 16px;
}

input, select {
  width: 100%;
  padding: 12px;
  margin-bottom: 8px;
  border-radius: 10px;
  border: 1px solid #ddd;
  box-sizing: border-box;
}

button {
  width: 100%;
  padding: 14px;
  background: #ff7f9f;
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 18px;
}

.result {
  margin-top: 10px;
  padding: 20px;
  background: white;
  border-radius: 16px;
  text-align: center;
}

.big {
  font-size: 28px;
  font-weight: bold;
}

.winA { color: #ff2d55; }
.winB { color: #2d6cff; }

.kuma {
  font-size: 40px;
}
</style>
</head>

<body>

<div class="container">

<h2>🧸 比較</h2>

<div class="card">
商品A
<input id="aQty" placeholder="数量">
<select id="aUnit">
<option value="1">個</option>
<option value="1">g</option>
<option value="1000">kg</option>
</select>
<input id="aPrice" placeholder="価格">
</div>

<div class="card">
商品B
<input id="bQty" placeholder="数量">
<select id="bUnit">
<option value="1">個</option>
<option value="1">g</option>
<option value="1000">kg</option>
</select>
<input id="bPrice" placeholder="価格">
</div>

<button onclick="compare()">比較</button>

<div id="result" class="result"></div>

</div>

<script>
function calc(price, qty, unit) {
  return price / (qty * unit);
}

function compare() {
  const a = calc(Number(aPrice.value), Number(aQty.value), Number(aUnit.value));
  const b = calc(Number(bPrice.value), Number(bQty.value), Number(bUnit.value));

  if (!a || !b) {
    result.innerHTML = "入力してください";
    return;
  }

  let text = "";
  let color = "";

  if (Math.abs(a - b) < 0.0001) {
    text = "🤝 同じ";
  } else if (a < b) {
    text = "🔥 商品Aが安い";
    color = "winA";
  } else {
    text = "🔥 商品Bが安い";
    color = "winB";
  }

  result.innerHTML = `
    <div class="kuma">🧸🎩</div>
    <div class="big ${color}">
      ${text}
    </div>
  `;
}
</script>

</body>
</html>
