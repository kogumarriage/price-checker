<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>単価比較アプリ</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@2"></script>

<style>
body {
  font-family: sans-serif;
  background: linear-gradient(135deg, #ffe4e1, #fff5f5);
  margin: 0;
}

.container {
  max-width: 420px;
  margin: auto;
  padding: 20px;
}

h1 {
  text-align: center;
}

.card {
  background: white;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 16px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

input, select, button {
  width: 100%;
  padding: 12px;
  margin-bottom: 10px;
  border-radius: 10px;
  border: 1px solid #ddd;
  box-sizing: border-box;
}

button {
  background: #ff7f7f;
  color: white;
  font-weight: bold;
  border: none;
}

video {
  width: 100%;
  border-radius: 10px;
  display: none;
}

.result {
  display: none;
  background: white;
  padding: 15px;
  border-radius: 16px;
  text-align: center;
}

.highlight {
  font-size: 20px;
  color: #ff4d6d;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<h1>🧸 お買い物比較</h1>

<div class="card">
<h3>商品A</h3>
<input id="aQty" placeholder="数量">
<select id="aUnit">
<option value="1">個</option>
<option value="1">g</option>
<option value="1000">kg</option>
</select>
<input id="aPrice" placeholder="価格">

<button onclick="startCamera('a')">📷 価格を撮影</button>
</div>

<div class="card">
<h3>商品B</h3>
<input id="bQty" placeholder="数量">
<select id="bUnit">
<option value="1">個</option>
<option value="1">g</option>
<option value="1000">kg</option>
</select>
<input id="bPrice" placeholder="価格">

<button onclick="startCamera('b')">📷 価格を撮影</button>
</div>

<video id="camera" autoplay></video>
<button id="captureBtn" onclick="capture()" style="display:none;">📸 撮影する</button>

<button onclick="compare()">比較する</button>

<div id="result" class="result"></div>

</div>

<script>
let currentTarget = "";
let stream;

function startCamera(target) {
  currentTarget = target;

  navigator.mediaDevices.getUserMedia({ video: true })
    .then(s => {
      stream = s;
      const video = document.getElementById("camera");
      video.style.display = "block";
      video.srcObject = s;
      document.getElementById("captureBtn").style.display = "block";
    })
    .catch(() => {
      alert("カメラが使えません");
    });
}

function capture() {
  const video = document.getElementById("camera");

  const canvas = document.createElement("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  const ctx = canvas.getContext("2d");
  ctx.drawImage(video, 0, 0);

  Tesseract.recognize(canvas, 'eng').then(({ data: { text } }) => {
    const numbers = text.match(/\d+/g);

    if (numbers) {
      document.getElementById(currentTarget + "Price").value = numbers[0];
    } else {
      alert("読み取れませんでした");
    }
  });

  // カメラ停止
  stream.getTracks().forEach(track => track.stop());
  document.getElementById("camera").style.display = "none";
  document.getElementById("captureBtn").style.display = "none";
}

function calc(price, qty, unit) {
  return price / (qty * unit);
}

function compare() {
  const a = calc(aPrice.value, aQty.value, aUnit.value);
  const b = calc(bPrice.value, bQty.value, bUnit.value);

  const diff = Math.abs(a - b);
  const percent = (diff / Math.max(a, b)) * 100;

  let winner = "";

  if (a < b) {
    winner = `👉 商品Aが約 ${percent.toFixed(1)}% お得`;
  } else {
    winner = `👉 商品Bが約 ${percent.toFixed(1)}% お得`;
  }

  const resultBox = document.getElementById("result");
  resultBox.style.display = "block";

  resultBox.innerHTML =
    `
    A単価：${a.toFixed(2)} 円<br>
    B単価：${b.toFixed(2)} 円<br><br>

    差額：${diff.toFixed(2)} 円<br><br>

    <div class="highlight">${winner}</div>
    `;
}
</script>

</body>
</html>
