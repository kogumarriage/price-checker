<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>単価比較アプリ</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@2"></script>

<style>
body {
  font-family: sans-serif;
  background: #eef2f7;
  margin: 0;
}

.container {
  max-width: 420px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 12px;
}

input, select, button {
  width: 100%;
  padding: 12px;
  margin-bottom: 10px;
  box-sizing: border-box;
}

video {
  width: 100%;
  border-radius: 10px;
}

.result {
  display: none;
  background: white;
  padding: 15px;
  border-radius: 12px;
}
</style>
</head>

<body>

<div class="container">

<h2>単価比較</h2>

<div class="card">
<h3>商品A</h3>
<input id="aQty" placeholder="数量">
<select id="aUnit">
<option value="1">個</option>
<option value="1">g</option>
<option value="1000">kg</option>
</select>
<input id="aPrice" placeholder="価格">

<button onclick="startCamera('a')">📷 カメラで読み取る</button>
</div>

<div class="card">
<h3>商品B</h3>
<input id="bQty" placeholder="数量">
<select id="bUnit">
<option value="1">個</option>
<option value="1">g</option>
<option value="1000">kg</option>
</select>
<input id="bPrice" placeholder="価格">

<button onclick="startCamera('b')">📷 カメラで読み取る</button>
</div>

<video id="camera" autoplay></video>
<button onclick="capture()">📸 撮影</button>

<button onclick="compare()">比較する</button>

<div id="result" class="result"></div>

</div>

<script>
let currentTarget = "";

function startCamera(target) {
  currentTarget = target;
  navigator.mediaDevices.getUserMedia({ video: true })
    .then(stream => {
      document.getElementById("camera").srcObject = stream;
    });
}

function capture() {
  const video = document.getElementById("camera");

  const canvas = document.createElement("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  const ctx = canvas.getContext("2d");
  ctx.drawImage(video, 0, 0);

  Tesseract.recognize(canvas, 'eng').then(({ data: { text } }) => {
    const numbers = text.match(/\d+/g);

    if (numbers) {
      document.getElementById(currentTarget + "Price").value = numbers[0];
    } else {
      alert("読み取れませんでした");
    }
  });
}

function calc(price, qty, unit) {
  return price / (qty * unit);
}

function compare() {
  const a = calc(aPrice.value, aQty.value, aUnit.value);
  const b = calc(bPrice.value, bQty.value, bUnit.value);

  let result = a < b ? "Aが安い" : "Bが安い";

  document.getElementById("result").style.display = "block";
  document.getElementById("result").innerHTML = result;
}
</script>

</body>
</html>
